<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auvii Diagnostics</title>
<style>
  body{font-family:-apple-system,sans-serif;max-width:640px;margin:0 auto;padding:24px 18px 80px;background:#F7F7F4;color:#14171C;}
  h1{font-size:20px;margin-bottom:6px;}
  p.sub{color:#4B5058;font-size:13.5px;margin-bottom:22px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;}
  .field input{width:100%;border:1.5px solid #DDDCD5;border-radius:8px;padding:10px 12px;font-size:13.5px;}
  button{background:#2F5FFF;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;width:100%;cursor:pointer;margin-bottom:28px;}
  .check{background:#fff;border:1.5px solid #DDDCD5;border-radius:10px;padding:14px 16px;margin-bottom:12px;}
  .check .title{font-weight:600;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .pill.pass{background:#E4F5EC;color:#1A7A4C;}
  .pill.fail{background:#FFEDE6;color:#B5431F;}
  .pill.pending{background:#EFEFEA;color:#4B5058;}
  .detail{font-size:12.5px;color:#4B5058;white-space:pre-wrap;word-break:break-word;margin-top:6px;font-family:monospace;background:#F7F7F4;border-radius:6px;padding:8px 10px;}
</style>
</head>
<body>
  <h1>Widget & Crawler Diagnostics</h1>
  <p class="sub">This checks each piece directly and shows the real error, instead of the widget's normal "fail silently" behavior.</p>

  <div class="field">
    <label>Agent ID to test</label>
    <input type="text" id="agentId" placeholder="e.g. f16be0ce-70cc-4aa2-9232-232f2378e1f0">
  </div>
  <button onclick="runChecks()">Run Diagnostics</button>

  <div id="results"></div>

<script src="sb-config.js"></script>
<script>
  function setCheck(id, title){
    document.getElementById('results').insertAdjacentHTML('beforeend', `
      <div class="check" id="check-${id}">
        <div class="title"><span>${title}</span><span class="pill pending" id="pill-${id}">Checking…</span></div>
        <div class="detail" id="detail-${id}"></div>
      </div>
    `);
  }
  function updateCheck(id, pass, detail){
    document.getElementById(`pill-${id}`).textContent = pass ? 'Pass' : 'Fail';
    document.getElementById(`pill-${id}`).className = 'pill ' + (pass ? 'pass' : 'fail');
    document.getElementById(`detail-${id}`).textContent = detail;
  }

  async function runChecks(){
    const agentId = document.getElementById('agentId').value.trim();
    document.getElementById('results').innerHTML = '';

    // Check 1: sb-chat.js reachable
    setCheck('widgetjs', 'sb-chat.js is uploaded and reachable');
    try {
      const res = await fetch('https://shopbrain2.github.io/shopbrain/sb-chat.js', { cache: 'no-store' });
      const text = await res.text();
      if(res.ok && text.includes('Auvii')){
        updateCheck('widgetjs', true, `HTTP ${res.status} — file found, ${text.length} bytes.`);
      } else {
        updateCheck('widgetjs', false, `HTTP ${res.status} — file exists but doesn't look right, or wasn't found at https://shopbrain2.github.io/shopbrain/sb-chat.js. Check it's uploaded to the same folder as your other files (account.html, index.html, etc).`);
      }
    } catch (e) {
      updateCheck('widgetjs', false, `Network error: ${e.message}. The file likely isn't uploaded, or the URL is wrong.`);
    }

    if(!agentId){
      document.getElementById('results').insertAdjacentHTML('beforeend', '<p style="color:#B5431F;font-size:13px;">Enter an Agent ID above to test the AI and crawler too.</p>');
      return;
    }

    // Check 2: chat_ai init action (what the widget calls first)
    setCheck('init', 'chat_ai — widget init call');
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/chat_ai`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ agent_id: agentId, action: 'init' })
      });
      const data = await res.json().catch(() => ({ error: 'Response was not valid JSON — function may be misconfigured or crashed.' }));
      if(res.ok && !data.error){
        updateCheck('init', true, `Agent: "${data.agent_name}" · Welcome message: "${data.welcome_message}"\n\nThis means the widget SHOULD show a bubble. If it still doesn't, the problem is on the page itself (sb-chat.js not included, wrong agent ID in the script tag, or a page-level JS error).`);
      } else {
        updateCheck('init', false, `HTTP ${res.status} — ${data.error || 'Unknown error'}\n\nThis is exactly why no bubble shows — the widget calls this first and renders NOTHING if it fails. Common causes: agent status isn't "active", the account is suspended, or the agent ID is wrong.`);
      }
    } catch (e) {
      updateCheck('init', false, `Network/CORS error: ${e.message}\n\nCheck chat_ai has "Enforce JWT Verification" turned OFF in Supabase.`);
    }

    // Check 3: chat_ai message action (actual AI reply)
    setCheck('message', 'chat_ai — sending a real test message');
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/chat_ai`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ agent_id: agentId, message: 'diagnostics test message', history: [] })
      });
      const data = await res.json().catch(() => ({ error: 'Response was not valid JSON.' }));
      if(res.ok && data.reply){
        updateCheck('message', true, `AI replied: "${data.reply.slice(0,200)}"`);
      } else {
        updateCheck('message', false, `HTTP ${res.status} — ${data.error || 'No reply returned'}`);
      }
    } catch (e) {
      updateCheck('message', false, `Network/CORS error: ${e.message}`);
    }

    // Check 4: scrape-website exists and is reachable (won't succeed without admin login, but tells us if it EXISTS)
    setCheck('crawl', 'scrape-website — function exists and responds');
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/scrape-website`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ agent_id: agentId, website_url: 'https://example.com' })
      });
      const data = await res.json().catch(() => null);
      if(data && data.error === 'Not authenticated'){
        updateCheck('crawl', true, `Function exists and responded correctly: "${data.error}" (expected — this test isn't logged in as admin, so this response is actually the CORRECT behavior. It proves the function is deployed properly.)`);
      } else if(data){
        updateCheck('crawl', true, `Function responded: ${JSON.stringify(data).slice(0,200)}`);
      } else {
        updateCheck('crawl', false, `HTTP ${res.status} — got a non-JSON response, usually means the function doesn't exist yet (404 page) or "Enforce JWT Verification" is blocking this request entirely.`);
      }
    } catch (e) {
      updateCheck('crawl', false, `Network/CORS error: ${e.message}\n\nIf you already created scrape-website, check "Enforce JWT Verification" is OFF for it — this exact error happens when it's ON, because it blocks even this test request before your code runs.`);
    }
  }
</script>
</body>
</html>
