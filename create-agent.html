<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create AI Agent — Auvii</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="sb-config.js"></script><style>:root{--paper:#f7f7f4;--ink:#14171c;--soft:#555b64;--line:#dddcd5;--blue:#2f5fff;--blue2:#eaefff;--green:#1faa80}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif}.wrap{max-width:560px;margin:0 auto;padding:30px 16px 60px}.logo{font-size:21px;font-weight:800;color:var(--blue);text-decoration:none}.top{margin-bottom:28px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}h1{font-size:27px;margin:0 0 8px}.sub{color:var(--soft);line-height:1.55;margin:0 0 22px}label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);outline:none}input:focus{border-color:var(--blue)}.btn{width:100%;border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.btn:disabled{opacity:.6;cursor:not-allowed}.error{display:none;background:#fff0ed;color:#b33a25;border-radius:9px;padding:11px;margin:12px 0;font-size:13px}.success{display:none;background:#eaf8f2;color:#14795c;border-radius:9px;padding:11px;margin:12px 0;font-size:13px}.features{margin:22px 0 24px;padding:0;list-style:none}.features li{padding:9px 0;border-bottom:1px solid #eee}.features li:before{content:'✓ ';color:var(--green);font-weight:800}</style></head><body><div class="wrap"><div class="top"><a class="logo" href="account.html">Auvii</a></div><div class="card"><h1>Create your AI Agent</h1><p class="sub">Create one AI assistant for your store. Your account can have one Auvii AI agent.</p><ul class="features"><li>Free for 7 days</li><li>Train it with your store information</li><li>Connect your website when ready</li><li>Test your AI before launch</li></ul><label for="agentName">AI name</label><input id="agentName" maxlength="80" placeholder="e.g. Auvii Assistant"><div id="error" class="error"></div><div id="success" class="success"></div><button id="createBtn" class="btn primary" style="margin-top:14px" onclick="createAgent()">Create AI Agent — Free</button></div></div><script>async function createAgent(){const btn=document.getElementById('createBtn'),error=document.getElementById('error'),success=document.getElementById('success');error.style.display='none';success.style.display='none';const name=document.getElementById('agentName').value.trim()||'Auvii Assistant';btn.disabled=true;btn.textContent='Creating…';try{const {data:{session},error:se}=await sb.auth.getSession();if(se)throw se;if(!session){location.href='auth.html';return;}const user=session.user;const {data:existing,error:ee}=await sb.from('ai_agents').select('id').eq('user_id',user.id).limit(1);if(ee)throw ee;if(existing&&existing.length){location.href='account.html';return;}const {data:created,error:ce}=await sb.from('ai_agents').insert({user_id:user.id,agent_name:name}).select('*').single();if(ce)throw ce;const id=created.id;await Promise.allSettled([sb.from('business_information').upsert({agent_id:id},{onConflict:'agent_id'}),sb.from('ai_settings').upsert({agent_id:id,tone:'friendly',response_length:'balanced'},{onConflict:'agent_id'}),sb.from('sales_assistant_settings').upsert({agent_id:id,enabled:false,allow_upsell:true,allow_cross_sell:true,max_products_shown:3,sales_tone:'friendly',recommendation_style:'balanced'},{onConflict:'agent_id'}),sb.from('widget_settings').upsert({agent_id:id},{onConflict:'agent_id'})]);success.textContent='Your AI agent was created. Opening your dashboard…';success.style.display='block';setTimeout(()=>location.href='account.html',500)}catch(e){console.error(e);error.textContent=e.message||'Could not create your AI agent.';error.style.display='block';btn.disabled=false;btn.textContent='Create AI Agent — Free'}}</script></body></html>
