<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Agent - Auvii</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="sb-config.js"></script>
  <style>
    :root {
      --auvii-brand: #2F5FFF;
      --ink: #0F172A;
      --ink-soft: #475569;
      --border: #E2E8F0;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --radius: 12px;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; width: 100%; max-width: 480px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .brand { font-size: 22px; font-weight: 800; color: var(--auvii-brand); margin-bottom: 24px; text-align: center; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--ink-soft); margin-bottom: 24px; }

    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .field input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
    .field input:focus { border-color: var(--auvii-brand); }

    .btn { width: 100%; padding: 12px; border-radius: 8px; background: var(--auvii-brand); color: #FFF; font-weight: 600; border: none; cursor: pointer; font-size: 14px; }
    .btn:hover { opacity: 0.9; }

    .alert { display: none; margin-top: 14px; font-size: 13px; padding: 10px; border-radius: 6px; text-align: center; }
    .alert-error { background: #FEE2E2; color: #B91C1C; }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">✨ Auvii</div>
  <h1>Create Your AI Agent</h1>
  <p>Set up an assistant for your store to handle customer chats and recommendations.</p>

  <form id="createAgentForm" onsubmit="handleCreateAgent(event)">
    <div class="field">
      <label for="agentName">Agent Name</label>
      <input type="text" id="agentName" placeholder="e.g. Auvii Assistant" required>
    </div>

    <button type="submit" class="btn" id="submitBtn">Create & Continue</button>
  </form>

  <div id="alertMsg" class="alert alert-error"></div>
</div>

<script>
  let sb = null;

  async function handleCreateAgent(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const alertEl = document.getElementById('alertMsg');
    const name = document.getElementById('agentName').value.trim();

    btn.disabled = true;
    btn.textContent = "Creating...";
    alertEl.style.display = 'none';

    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      // 1. Insert Agent
      const { data: agent, error: agentError } = await sb
        .from('agents')
        .insert([{ user_id: user.id, name: name }])
        .select()
        .single();

      if (agentError) throw agentError;

      // 2. Insert Default Widget Settings
      const { error: wsError } = await sb
        .from('widget_settings')
        .insert([{
          agent_id: agent.id,
          welcome_message: 'Hi! 👋 How can I help you today?',
          position: 'bottom-right',
          theme_color: '#2F5FFF'
        }]);

      if (wsError) throw wsError;

      // Redirect back to account dashboard
      window.location.href = 'account.html';

    } catch (err) {
      alertEl.style.display = 'block';
      alertEl.textContent = err.message || 'Failed to create agent.';
      btn.disabled = false;
      btn.textContent = "Create & Continue";
    }
  }

  function init() {
    if (window.sbClient) sb = window.sbClient;
    else if (window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
