<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create AI Agent — Auvii</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="sb-config.js"></script>
  <style>
    :root {
      --paper: #f7f7f4;
      --ink: #14171c;
      --soft: #555b64;
      --line: #dddcd5;
      --blue: #2f5fff;
      --blue2: #eaefff;
      --green: #1faa80;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 30px 16px 60px; }
    .logo { font-size: 21px; font-weight: 800; color: var(--blue); text-decoration: none; display: inline-block; }
    .top { margin-bottom: 28px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
    h1 { font-size: 27px; margin: 0 0 8px; }
    .sub { color: var(--soft); line-height: 1.55; margin: 0 0 22px; }
    label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 7px; }
    input { width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--paper); outline: none; font-size: 14px; }
    input:focus { border-color: var(--blue); }
    .btn { width: 100%; border: 0; border-radius: 9px; padding: 12px 16px; font-weight: 800; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
    .primary { background: var(--blue); color: #fff; }
    .primary:hover { opacity: 0.9; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .error { display: none; background: #fff0ed; color: #b33a25; border-radius: 9px; padding: 11px; margin: 12px 0; font-size: 13px; border: 1px solid #f2c7c0; }
    .success { display: none; background: #eaf8f2; color: #14795c; border-radius: 9px; padding: 11px; margin: 12px 0; font-size: 13px; border: 1px solid #c2e8d8; }
    .features { margin: 22px 0 24px; padding: 0; list-style: none; }
    .features li { padding: 9px 0; border-bottom: 1px solid #eee; }
    .features li:before { content: '✓ '; color: var(--green); font-weight: 800; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <a class="logo" href="account.html">✨ Auvii</a>
  </div>
  
  <div class="card">
    <h1>Create your AI Agent</h1>
    <p class="sub">Create an AI assistant for your store. Your account can manage one primary Auvii AI agent.</p>
    
    <ul class="features">
      <li>Free 7-day trial period</li>
      <li>Train it using your store URL or Knowledge Base</li>
      <li>Embed seamlessly on Wix or custom websites</li>
      <li>Live Analytics & Chat History</li>
    </ul>

    <label for="agentName">AI Agent Name</label>
    <input id="agentName" maxlength="80" placeholder="e.g. Auvii Assistant">
    
    <div id="error" class="error"></div>
    <div id="success" class="success"></div>
    
    <button id="createBtn" class="btn primary" style="margin-top:14px" onclick="createAgent()">Create AI Agent — Free</button>
  </div>
</div>

<script>
  let sb = null;

  function initSupabase() {
    if (window.sbClient) {
      sb = window.sbClient;
    } else if (window.supabase && typeof SUPABASE_URL !== 'undefined') {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  }

  async function createAgent() {
    if (!sb) initSupabase();
    if (!sb) {
      alert("Supabase client configuration not found. Check sb-config.js");
      return;
    }

    const btn = document.getElementById('createBtn');
    const error = document.getElementById('error');
    const success = document.getElementById('success');

    error.style.display = 'none';
    success.style.display = 'none';

    const name = document.getElementById('agentName').value.trim() || 'Auvii Assistant';
    btn.disabled = true;
    btn.textContent = 'Creating…';

    try {
      // 1. Verify User Session
      const { data: { session }, error: sessionError } = await sb.auth.getSession();
      if (sessionError) throw sessionError;
      
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      const user = session.user;

      // 2. Check if User Already Has an Agent
      const { data: existing, error: checkError } = await sb
        .from('agents')
        .select('id')
        .eq('user_id', user.id)
        .limit(1);

      if (!checkError && existing && existing.length > 0) {
        window.location.href = 'account.html';
        return;
      }

      // 3. Create Main Agent Record in 'agents' table
      const { data: created, error: agentInsertError } = await sb
        .from('agents')
        .insert([{ user_id: user.id, name: name }])
        .select('*')
        .single();

      if (agentInsertError) throw agentInsertError;

      const agentId = created.id;

      // 4. Populate Associated Settings
      await Promise.allSettled([
        sb.from('widget_settings').upsert({
          agent_id: agentId,
          welcome_message: 'Hi! 👋 How can I help you today?',
          position: 'bottom-right',
          theme_color: '#2F5FFF'
        }, { onConflict: 'agent_id' }),
        
        sb.from('business_information').upsert({
          agent_id: agentId
        }, { onConflict: 'agent_id' }),

        sb.from('ai_settings').upsert({
          agent_id: agentId,
          tone: 'friendly',
          response_length: 'balanced'
        }, { onConflict: 'agent_id' })
      ]);

      success.textContent = 'Your AI agent was created! Opening your dashboard…';
      success.style.display = 'block';

      setTimeout(() => {
        window.location.href = 'account.html';
      }, 600);

    } catch (err) {
      console.error(err);
      error.textContent = err.message || 'Could not create your AI agent.';
      error.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create AI Agent — Free';
    }
  }

  document.addEventListener('DOMContentLoaded', initSupabase);
</script>
</body>
</html>
